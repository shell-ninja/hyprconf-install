palette = "noctalia"
format = """
$directory\
$fill\
$git_branch\
$git_status\
$git_metrics\
$python\
$lua\
$nodejs\
$cmd_duration\
$line_break\
$character"""

# add_newline = true
command_timeout = 100
scan_timeout = 10

[username]
style_user = 'bold green'
style_root = 'bold red'
format = '[$user]($style) '
disabled = false
show_always = true

[hostname]
style = 'bold blue'
ssh_only = false
format = 'in [$hostname]($style) '

[character]
success_symbol = '[❯](bold green)'
error_symbol = '[❯](bold red)'
vimcmd_symbol = '[❮](bold red)'
vimcmd_replace_one_symbol = '[❮](bold yellow)'
vimcmd_replace_symbol = '[❮](bold yellow)'
vimcmd_visual_symbol = '[❮](bold magenta)'

[directory]
style = 'bold fg:peach'
format = '[$path ]($style)'
truncation_length = 3
truncation_symbol = '../'
truncate_to_repo = false
home_symbol = ''
read_only = ' 󰉐 '

[directory.substitutions]
'Documents' = ' 󰈙 '
'Downloads' = '  '
'Music' = '  '
'Pictures' = '  '
'Videos' = '  '
'Home' = ''

[git_branch]
style = 'italic fg:maroon'
symbol = ' '
format = '(flamingo) [$symbol$branch ]($style)'

[git_status]
style = 'italic fg:subtext0'
modified = '!${count}'
ahead = '⇡${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
behind = '⇣${count}'
deleted = '🗑'

[git_metrics]
disabled = false
added_style = 'bold green'
deleted_style = 'bold red'
format = '[+$added]($added_style)/[-$deleted]($deleted_style) '

[fill]
symbol = ' '
style = 'light cyan'

[python]
style = 'blue'
symbol = ' '
format = '[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'
pyenv_version_name = true
python_binary = 'python3'
pyenv_prefix = ''

[lua]
style = 'peach'
format = '[ $version]($style)'

[nodejs]
style = 'green'
format = '[ $version]($style)'

[shell]
bash_indicator = ' '
fish_indicator = '󰈺 '
zsh_indicator = ''
powershell_indicator = '_'
unknown_indicator = 'mystery shell'
style = 'cyan bold'
disabled = false

[cmd_duration]
min_time = 500
format = '  [$duration](bold italic dimmed rosewater)'

