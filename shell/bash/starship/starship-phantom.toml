# ─── Phantom ─────────────────────────────────────────────────────────────────
# "Barely there" — ultra-minimal, info hides in right prompt until needed
# ─────────────────────────────────────────────────────────────────────────────

command_timeout = 100
scan_timeout = 10

format = """\
$directory\
$line_break\
$character"""

right_format = """\
$git_branch\
$git_status\
$git_metrics\
$python\
$nodejs\
$rust\
$golang\
$cmd_duration\
"""

[directory]
format = '[$path]($style)[$read_only]($read_only_style)'
style = 'fg:#8b92a8'
read_only_style = 'fg:#565a6e'
truncation_length = 3
truncation_symbol = '…/'
home_symbol = '~'
read_only = ' '

[git_branch]
format = '[$symbol$branch]($style)'
symbol = ''
style = 'dimmed fg:#7c83a0'

[git_status]
format = '[ $all_status$ahead_behind]($style)'
style = 'dimmed fg:#6b7394'
modified = '!${count}'
staged = '+${count}'
deleted = '-${count}'
ahead = '⇡${count}'
behind = '⇣${count}'
diverged = '⇕${ahead_count}/${behind_count}'
untracked = '?${count}'

[git_metrics]
disabled = false
added_style = 'dimmed fg:#8fa89c'
deleted_style = 'dimmed fg:#a88f8f'
format = ' [+$added]($added_style)[/-$deleted]($deleted_style)'

[python]
format = '[ · ](dimmed fg:#3d4059)[$symbol$version]($style)'
symbol = ''
style = 'dimmed fg:#6b7394'

[nodejs]
format = '[ · ](dimmed fg:#3d4059)[$symbol$version]($style)'
symbol = ''
style = 'dimmed fg:#6b7394'

[rust]
format = '[ · ](dimmed fg:#3d4059)[$symbol$version]($style)'
symbol = ''
style = 'dimmed fg:#6b7394'

[golang]
format = '[ · ](dimmed fg:#3d4059)[$symbol$version]($style)'
symbol = ''
style = 'dimmed fg:#6b7394'

[cmd_duration]
min_time = 500
format = '[ · ](dimmed fg:#3d4059)[$duration]($style)'
style = 'dimmed italic fg:#565a6e'

[line_break]
disabled = false

[character]
success_symbol = '[λ](fg:#7c83a0)'
error_symbol = '[λ](fg:#c25d64)'
vimcmd_symbol = '[λ](bold fg:#d4a959)'
vimcmd_replace_one_symbol = '[λ](bold fg:#c25d64)'
vimcmd_replace_symbol = '[λ](bold fg:#c25d64)'
vimcmd_visual_symbol = '[λ](bold fg:#9a7cd4)'
