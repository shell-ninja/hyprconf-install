# ─── Dusk ─────────────────────────────────────────────────────────────────────
# "Twilight Soft" — dusky indigo, dusty rose, muted peach, gentle spacing
# ─────────────────────────────────────────────────────────────────────────────

command_timeout = 100
scan_timeout = 10

format = """\
$directory\
$git_branch\
$git_status\
$git_metrics\
$python\
$nodejs\
$rust\
$golang\
$cmd_duration\
$line_break\
$character"""

right_format = """\
$time\
"""

[directory]
format = '[$path]($style)[$read_only]($read_only_style)'
style = 'bold fg:#b8bb26'
read_only_style = 'fg:#fb4934'
truncation_length = 3
truncation_symbol = '…/'
home_symbol = ''
read_only = ' 󰌾'

[git_branch]
format = '  [ $branch]($style)'
style = 'fg:#fabd2f'

[git_status]
format = ' [$all_status$ahead_behind]($style)'
style = 'fg:#928374'
modified = '[*${count}](fg:#fe8019)'
staged = '[+${count}](fg:#b8bb26)'
deleted = '[-${count}](fg:#fb4934)'
ahead = '[⇡${count}](fg:#83a598)'
behind = '[⇣${count}](fg:#fb4934)'
diverged = '[⇕${ahead_count}/${behind_count}](fg:#d3869b)'
untracked = '[?${count}](fg:#928374)'

[git_metrics]
disabled = false
added_style = 'fg:#b8bb26'
deleted_style = 'fg:#fb4934'
format = ' [+$added]($added_style)[/-$deleted]($deleted_style)'

[python]
format = '  [py $version]($style)'
style = 'dimmed fg:#928374'

[nodejs]
format = '  [node $version]($style)'
style = 'dimmed fg:#928374'

[rust]
format = '  [rs $version]($style)'
style = 'dimmed fg:#928374'

[golang]
format = '  [go $version]($style)'
style = 'dimmed fg:#928374'

[cmd_duration]
min_time = 500
format = '  [$duration]($style)'
style = 'dimmed italic fg:#928374'

[time]
disabled = false
format = '[$time]($style)'
style = 'dimmed fg:#665c54'
time_format = '%I:%M %p'

[line_break]
disabled = false

[character]
success_symbol = '[→](bold fg:#83a598) '
error_symbol = '[→](bold fg:#fb4934) '
vimcmd_symbol = '[←](bold fg:#fabd2f) '
vimcmd_replace_one_symbol = '[←](bold fg:#fb4934) '
vimcmd_replace_symbol = '[←](bold fg:#fb4934) '
vimcmd_visual_symbol = '[↔](bold fg:#d3869b) '
