# ─── Drift ───────────────────────────────────────────────────────────────────
# "Flowing and quiet" — dot separators with fill, gentle teal/slate tones
# ─────────────────────────────────────────────────────────────────────────────

command_timeout = 100
scan_timeout = 10

format = """\
$directory\
$git_branch\
$git_status\
$git_metrics\
$python\
$nodejs\
$rust\
$golang\
$cmd_duration\
$fill\
$time\
$line_break\
$character"""

[directory]
format = '[ $path]($style)[$read_only]($read_only_style)'
style = 'bold fg:#89b4fa'
read_only_style = 'fg:#6c7086'
truncation_length = 3
truncation_symbol = '…/'
home_symbol = '~'
read_only = ' '

[git_branch]
format = '[ · ](fg:#45475a)[$symbol$branch]($style)'
symbol = '⎇ '
style = 'fg:#cba6f7'

[git_status]
format = '[ $all_status$ahead_behind]($style)'
style = 'fg:#6c7086'
modified = '[!${count}](fg:#f9e2af)'
staged = '[+${count}](fg:#a6e3a1)'
deleted = '[-${count}](fg:#f38ba8)'
ahead = '[↑${count}](fg:#89b4fa)'
behind = '[↓${count}](fg:#f38ba8)'
diverged = '[↑${ahead_count}↓${behind_count}](fg:#cba6f7)'
untracked = '[?${count}](fg:#6c7086)'

[git_metrics]
disabled = false
added_style = 'fg:#a6e3a1'
deleted_style = 'fg:#f38ba8'
format = '[ · ](fg:#45475a)[+$added]($added_style)[/-$deleted]($deleted_style)'

[python]
format = '[ · ](fg:#45475a)[$symbol$version]($style)'
symbol = ' '
style = 'fg:#89b4fa'

[nodejs]
format = '[ · ](fg:#45475a)[$symbol$version]($style)'
symbol = ' '
style = 'fg:#a6e3a1'

[rust]
format = '[ · ](fg:#45475a)[$symbol$version]($style)'
symbol = ' '
style = 'fg:#f9e2af'

[golang]
format = '[ · ](fg:#45475a)[$symbol$version]($style)'
symbol = ' '
style = 'fg:#89dceb'

[cmd_duration]
min_time = 500
format = '[ · ](fg:#45475a)[$duration]($style)'
style = 'italic fg:#6c7086'

[fill]
symbol = ' ·'
style = 'fg:#313244'

[time]
disabled = false
format = '[ $time]($style)'
style = 'fg:#6c7086'
time_format = '%I:%M %p'

[line_break]
disabled = false

[character]
success_symbol = '[❯](bold fg:#a6e3a1)'
error_symbol = '[❯](bold fg:#f38ba8)'
vimcmd_symbol = '[❮](bold fg:#f9e2af)'
vimcmd_replace_one_symbol = '[❮](bold fg:#f38ba8)'
vimcmd_replace_symbol = '[❮](bold fg:#f38ba8)'
vimcmd_visual_symbol = '[❮](bold fg:#cba6f7)'
