# ─── Hyper ────────────────────────────────────────────────────────────────────
# "Modern Developer" — high contrast typography, Vercel-style clean triangles, zero clutter
# ─────────────────────────────────────────────────────────────────────────────

command_timeout = 100
scan_timeout = 10

format = """\
$directory\
$git_branch\
$git_status\
$git_metrics\
$python\
$nodejs\
$rust\
$golang\
$cmd_duration\
$line_break\
$character"""

right_format = """\
$time\
"""

[directory]
format = '[$path]($style)[$read_only]($read_only_style)'
style = 'bold fg:#e2e8f0'
read_only_style = 'fg:#f87171'
truncation_length = 3
truncation_symbol = '…/'
home_symbol = '~'
read_only = ' 󰌾'

[git_branch]
format = '  [▲ $branch]($style)'
style = 'fg:#38bdf8'

[git_status]
format = ' [$all_status$ahead_behind]($style)'
style = 'fg:#94a3b8'
modified = '[*${count}](fg:#fbbf24)'
staged = '[+${count}](fg:#4ade80)'
deleted = '[-${count}](fg:#f87171)'
ahead = '[⇡${count}](fg:#38bdf8)'
behind = '[⇣${count}](fg:#f87171)'
diverged = '[⇕${ahead_count}/${behind_count}](fg:#c084fc)'
untracked = '[?${count}](fg:#64748b)'

[git_metrics]
disabled = false
added_style = 'fg:#4ade80'
deleted_style = 'fg:#f87171'
format = ' [+$added]($added_style)[/-$deleted]($deleted_style)'

[python]
format = '  [py $version]($style)'
style = 'dimmed fg:#64748b'

[nodejs]
format = '  [node $version]($style)'
style = 'dimmed fg:#64748b'

[rust]
format = '  [rs $version]($style)'
style = 'dimmed fg:#64748b'

[golang]
format = '  [go $version]($style)'
style = 'dimmed fg:#64748b'

[cmd_duration]
min_time = 500
format = '  [$duration]($style)'
style = 'dimmed italic fg:#64748b'

[time]
disabled = false
format = '[$time]($style)'
style = 'dimmed fg:#475569'
time_format = '%I:%M %p'

[line_break]
disabled = false

[character]
success_symbol = '[▲](bold fg:#38bdf8) '
error_symbol = '[▲](bold fg:#f87171) '
vimcmd_symbol = '[▼](bold fg:#fbbf24) '
vimcmd_replace_one_symbol = '[▼](bold fg:#f87171) '
vimcmd_replace_symbol = '[▼](bold fg:#f87171) '
vimcmd_visual_symbol = '[◆](bold fg:#c084fc) '
